<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fitness Tracker Home</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1c1c2b, #2e2e50);
    color: white;
    text-align: center;
}

/* Header */
header {
    font-size: 50px;
    padding: 60px 0 40px 0;
    text-shadow: 2px 2px 10px rgba(0,0,0,0.7);
}

/* Category Cards */
.categories {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 30px;
    margin-top: 50px;
}

.category-card {
    background: rgba(255,255,255,0.1);
    border-radius: 20px;
    width: 250px;
    padding: 20px;
    text-align: center;
    transition: all 0.3s ease;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
    text-decoration: none;
    color: white;
}

.category-card img {
    width: 100%;
    border-radius: 15px;
    margin-bottom: 15px;
}

.category-card h2 {
    margin: 0;
    font-size: 28px;
}

.category-card:hover {
    background: rgba(255,255,255,0.3);
    transform: scale(1.05);
    box-shadow: 0 0 30px rgba(255,255,255,0.5);
}
</style>
</head>
<body>

<header>Fitness Tracker</header>

<div class="categories">

    <a href="yoga.html" class="category-card">
        <img src="https://images.unsplash.com/photo-1559757175-d8f445d08e59?auto=format&fit=crop&w=600&q=80" alt="Yoga">
        <h2>Yoga</h2>
    </a>

    <a href="strength.html" class="category-card">
        <img src="https://images.unsplash.com/photo-1599058917212-df02a35dce54?auto=format&fit=crop&w=600&q=80" alt="Strength">
        <h2>Strength</h2>
    </a>

    <a href="cardio.html" class="category-card">
        <img src="https://images.unsplash.com/photo-1594737625785-12d85772e127?auto=format&fit=crop&w=600&q=80" alt="Cardio">
        <h2>Cardio</h2>
    </a>

</div>

</body>
</html>
